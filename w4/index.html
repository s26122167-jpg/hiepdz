<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER WISH POOL - 遊戲風許願池與留言板</title>

  <!-- Google Fonts: Orbitron, Rajdhani & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cyber: {
              bg: '#0a0b10',        /* Nền tối đậm Synthwave */
              card: '#121520',      /* Nền card neon dark */
              border: '#1f293d',    /* Viền kim loại */
              primary: '#00f0ff',   /* Xanh Cyan Neon */
              secondary: '#ff0055', /* Hồng Magenta Neon */
              accent: '#7000ff',    /* Tím Neon */
              text: '#e2e8f0',      /* Trắng xám */
              muted: '#64748b'      /* Xám mờ */
            }
          },
          fontFamily: {
            gaming: ['Orbitron', 'sans-serif'],
            tech: ['Rajdhani', 'Noto Sans TC', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    /* 全局 Gaming 風格 */
    body {
      font-family: 'Rajdhani', 'Noto Sans TC', sans-serif;
      background-color: #0a0b10;
      color: #e2e8f0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Cyber Tech Grid Background */
    .cyber-grid {
      background-image: 
        linear-gradient(to right, rgba(0, 240, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 0, 85, 0.05) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Gaming Glass Card & Glow Effect */
    .cyber-card {
      background: rgba(18, 21, 32, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
    }

    /* Laser Sweep Effect */
    .laser-effect {
      position: relative;
      overflow: hidden;
    }
    .laser-effect::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 240, 255, 0.3), transparent);
      transition: 0.5s ease;
    }
    .laser-effect:hover::before {
      left: 100%;
    }

    /* Typing Cursor */
    .typing-cursor::after {
      content: '_';
      animation: blink 0.6s infinite;
      color: #00f0ff;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0b10;
    }
    ::-webkit-scrollbar-thumb {
      background: linear-gradient(to bottom, #00f0ff, #ff0055);
      border-radius: 3px;
    }

    /* Gaming Corner Markers */
    .cyber-corner {
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: #00f0ff;
      transition: all 0.3s ease;
    }
    .c-tl { top: 0; left: 0; border-top: 2px solid; border-left: 2px solid; }
    .c-tr { top: 0; right: 0; border-top: 2px solid; border-right: 2px solid; }
    .c-bl { bottom: 0; left: 0; border-bottom: 2px solid; border-left: 2px solid; }
    .c-br { bottom: 0; right: 0; border-bottom: 2px solid; border-right: 2px solid; }

    .wish-card:hover .cyber-corner {
      width: 14px;
      height: 14px;
      border-color: #ff0055;
    }

    /* Wish Card Hover Effects */
    .wish-card {
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }
    .wish-card:hover {
      transform: translateY(-5px);
      border-color: rgba(255, 0, 85, 0.6);
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.3), inset 0 0 10px rgba(0, 240, 255, 0.1);
    }

    /* Hexagon Loader */
    .cyber-loader {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 240, 255, 0.2);
      border-radius: 50%;
      border-top-color: #00f0ff;
      border-bottom-color: #ff0055;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="flex flex-col min-h-screen cyber-grid selection:bg-cyber-secondary selection:text-white">

  <!-- Interactive Canvas Particles -->
  <canvas id="dustCanvas" class="fixed inset-0 pointer-events-none z-50"></canvas>

  <!-- ==================== HEADER SECTION ==================== -->
  <header class="border-b border-cyber-border bg-cyber-bg/90 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg bg-cyber-card border border-cyber-primary/40 flex items-center justify-center text-cyber-primary font-gaming font-bold text-xl shadow-[0_0_10px_rgba(0,240,255,0.3)] transform hover:rotate-12 transition-transform">
          <i class="fa-solid fa-gamepad"></i>
        </div>
        <div>
          <h1 class="text-xl md:text-2xl font-gaming font-bold tracking-wider text-white flex items-center gap-2">
            CYBER WISH POOL <span class="text-cyber-secondary font-tech text-base md:text-lg">// QUEST BOARD</span>
          </h1>
          <p id="typewriterText" class="text-xs text-cyber-muted font-mono min-h-[16px] typing-cursor tracking-widest uppercase"></p>
        </div>
      </div>
      <span class="text-xs px-3 py-1 rounded bg-cyber-primary/10 text-cyber-primary font-gaming border border-cyber-primary/30 shadow-[0_0_10px_rgba(0,240,255,0.2)] flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-cyber-primary animate-ping"></span>
        SYSTEM ONLINE
      </span>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 relative z-10 space-y-8">

    <!-- FORM SECTION -->
    <section class="cyber-card p-4 md:p-6 relative overflow-hidden">
      <div class="cyber-corner c-tl"></div>
      <div class="cyber-corner c-tr"></div>
      <div class="cyber-corner c-bl"></div>
      <div class="cyber-corner c-br"></div>
     
      <div class="flex items-center justify-between mb-4 border-b border-cyber-border pb-3">
        <h2 class="font-gaming font-bold text-base md:text-lg text-cyber-primary flex items-center gap-2 tracking-wide uppercase">
          <i class="fa-solid fa-terminal text-cyber-secondary"></i> TRANSMIT MESSAGE // SUBMIT QUEST
        </h2>
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSdSXP6DfZGxYmGaN1GKHBJbAaVV_RVXLj-f77FnVcHMfJxgWQ/viewform" target="_blank" class="text-xs font-gaming text-cyber-secondary hover:text-cyber-primary transition-colors flex items-center gap-1 uppercase">
          <i class="fa-solid fa-arrow-up-right-from-square"></i> OPEN TERMINAL
        </a>
      </div>

      <div class="w-full overflow-hidden rounded border border-cyber-border bg-cyber-bg">
        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLSdSXP6DfZGxYmGaN1GKHBJbAaVV_RVXLj-f77FnVcHMfJxgWQ/viewform?embedded=true"
          width="100%"
          height="650"
          frameborder="0"
          marginheight="0"
          marginwidth="0"
          class="w-full"
        >LOADING SYSTEM TERMINAL...</iframe>
      </div>
    </section>

    <!-- LOADING ANIMATION -->
    <div id="loading" class="flex flex-col items-center justify-center py-20 text-cyber-muted">
      <div class="cyber-loader mb-4"></div>
      <div class="font-gaming text-xs tracking-widest text-cyber-primary animate-pulse uppercase">Syncing Cyber Data Stream...</div>
    </div>

    <!-- MESSAGE BOARD GRID -->
    <div id="message-board" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5" style="display: none;"></div>

  </main>

  <footer class="border-t border-cyber-border bg-cyber-bg/80 py-4 text-center text-xs font-gaming text-cyber-muted relative z-10 mt-auto tracking-widest uppercase">
    <p>© 2026 CYBER WISH POOL • SYSTEM VERSION 2.0.77</p>
  </footer>

  <!-- ==================== JAVASCRIPT LOGIC & EFFECTS ==================== -->
  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/18joM6HHlNb9ojSSgLQR3ZYxV_pJwoTJXgaiUXMmZvDA/export?format=csv';

    document.addEventListener('DOMContentLoaded', () => {
      typeWriter();
      animateCanvas();
      fetchWishMessages();
    });

    // --- 1. TYPEWRITER ANIMATION ---
    const fullText = "INITIALIZING GAMING NETWORK • TRANSMIT YOUR MESSAGE TO THE POOL";
    const typewriterEl = document.getElementById("typewriterText");
    let typeIndex = 0;

    function typeWriter() {
      if (typeIndex < fullText.length) {
        typewriterEl.textContent += fullText.charAt(typeIndex);
        typeIndex++;
        setTimeout(typeWriter, 40);
      }
    }

    // --- 2. RETRO GAMING AUDIO SFX (8-BIT SYNTH) ---
    let audioCtx = null;
    function play8BitClickSFX() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'square'; // Nốt nhạc dạng vuông mang âm hưởng 8-bit / Arcade
        osc.frequency.setValueAtTime(440, audioCtx.currentTime); // Node A4
        osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.05); // Ramp up sang A5
        
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch(e) {}
    }

    // --- 3. NEON CYBER PARTICLES CANVAS ---
    const canvas = document.getElementById('dustCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let burstParticles = [];
    function triggerClickBurst(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      for (let i = 0; i < 18; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 2;
        burstParticles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: Math.random() * 3 + 1.5,
          color: Math.random() > 0.5 ? '#00f0ff' : '#ff0055',
          alpha: 1
        });
      }
    }

    window.addEventListener('click', (e) => {
      play8BitClickSFX();
      triggerClickBurst(e);
    });

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = burstParticles.length - 1; i >= 0; i--) {
        let bp = burstParticles[i];
        bp.x += bp.vx;
        bp.y += bp.vy;
        bp.alpha -= 0.03;

        if (bp.alpha <= 0) {
          burstParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = Math.max(0, bp.alpha);
        ctx.fillStyle = bp.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = bp.color;
        ctx.fillRect(bp.x, bp.y, bp.size, bp.size); // Vuông hóa pixel cho hiệu ứng gaming
        ctx.restore();
      }
      requestAnimationFrame(animateCanvas);
    }

    // --- 4. FETCH CSV & RENDER ---
    async function fetchWishMessages() {
      const loadingEl = document.getElementById('loading');
      const boardEl = document.getElementById('message-board');

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);
       
        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        const messages = parsedData.slice(1).map(row => ({
          timestamp: row[0] ? row[0].trim() : '',
          name: row[1] ? row[1].trim() : 'ANONYMOUS PLAYER',
          message: row[2] ? row[2].trim() : ''
        })).filter(item => item.message !== '' || item.name !== '');

        loadingEl.style.display = 'none';
        boardEl.style.display = 'grid';

        renderMessages(messages);

      } catch (error) {
        console.error('Fetch Error:', error);
        loadingEl.innerHTML = `
          <div class="cyber-card p-6 border-cyber-secondary text-center text-white">
            <i class="fa-solid fa-triangle-exclamation text-3xl text-cyber-secondary mb-2"></i>
            <h3 class="font-gaming font-bold text-lg">SYSTEM ERROR: UNABLE TO FETCH DATA</h3>
            <p class="text-xs text-cyber-muted mt-1 font-tech">Please check Google Sheet access permissions.</p>
          </div>
        `;
      }
    }

    function parseCSV(text) {
      const result = [];
      let row = [];
      let cur = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {
          if (inQuotes && next === '"') { cur += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (c === ',' && !inQuotes) {
          row.push(cur); cur = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') i++;
          row.push(cur); cur = '';
          if (row.some(f => f.length > 0)) result.push(row);
          row = [];
        } else {
          cur += c;
        }
      }
      if (cur.length > 0 || row.length > 0) { row.push(cur); result.push(row); }
      return result;
    }

    function renderMessages(messages) {
      const boardEl = document.getElementById('message-board');

      if (messages.length === 0) {
        boardEl.innerHTML = `
          <div class="col-span-full cyber-card p-8 text-center text-cyber-muted font-gaming uppercase">
            <i class="fa-solid fa-ghost text-3xl mb-2 text-cyber-primary"></i>
            <p>NO TRANSMISSIONS YET. BE THE FIRST PLAYER TO DROP A MESSAGE!</p>
          </div>
        `;
        return;
      }

      const htmlContent = messages.reverse().map(item => {
        const safeName = escapeHTML(item.name);
        const safeMessage = escapeHTML(item.message);
        const safeTime = escapeHTML(item.timestamp);
        const firstChar = safeName.charAt(0).toUpperCase() || 'P';

        return `
          <article class="wish-card cyber-card p-5 relative flex flex-col justify-between laser-effect">
            <div class="cyber-corner c-tl"></div>
            <div class="cyber-corner c-tr"></div>
            <div class="cyber-corner c-bl"></div>
            <div class="cyber-corner c-br"></div>

            <div>
              <div class="flex items-center pb-3 border-b border-cyber-border mb-3">
                <div class="w-10 h-10 rounded bg-cyber-bg border border-cyber-primary text-cyber-primary flex items-center justify-center font-gaming font-bold text-lg mr-3 shadow-[0_0_8px_rgba(0,240,255,0.4)] flex-shrink-0">
                  ${firstChar}
                </div>
                <div class="flex-1 overflow-hidden">
                  <div class="font-gaming font-bold text-white text-sm truncate tracking-wide">${safeName}</div>
                  <div class="text-[11px] font-mono text-cyber-muted mt-0.5"><i class="fa-regular fa-clock"></i> ${safeTime}</div>
                </div>
              </div>
              <div class="text-xs sm:text-sm leading-relaxed text-cyber-text font-tech whitespace-pre-wrap break-words mb-4 tracking-wide">
                ${safeMessage}
              </div>
            </div>

            <div class="text-right text-[11px] font-gaming text-cyber-secondary pt-2 border-t border-cyber-border/40 flex items-center justify-end gap-1 tracking-widest uppercase">
              <i class="fa-solid fa-bolt text-cyber-primary"></i> PLAYER DATA LOG
            </div>
          </article>
        `;
      }).join('');

      boardEl.innerHTML = htmlContent;
    }

    function escapeHTML(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
